name: Rust quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -j 4 -- -D warnings
      - run: cargo test --locked -j 4
      - run: ./scripts/build.ps1
      - run: python scripts/check_release.py
