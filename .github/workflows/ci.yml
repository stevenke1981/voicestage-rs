name: Source checks (binary hold)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The unresolved provider finding prohibits binary builds/execution/uploads.
      # Use the runner's existing formatter; no dependency build or app execution.
      - name: Check commit whitespace
        run: git show --format= --check HEAD
      - name: Check Rust source formatting only
        run: cargo fmt --all --check
