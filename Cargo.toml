[package]
name = "voicestage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lightweight Windows dialogue script editor and Fish Audio client"
repository = "https://github.com/stevenke1981/voicestage-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
zeroize = "1"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.balanced]
inherits = "release"
opt-level = 2
lto = "thin"

[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"

[profile.fast]
inherits = "release"
opt-level = 3
lto = "fat"
